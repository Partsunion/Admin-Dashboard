name: Admin Dashboard CI

on:
  push:
    branches: [main, 'release/internal-platforms-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Admin-Dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: Admin-Dashboard

      - name: Checkout paired CRM source for shared-design contract tests
        uses: actions/checkout@v4
        with:
          repository: Partsunion/crm-system
          ref: 0500e66d9ee8ce1e16d988f2dcc7da90189534b3
          path: CRM-System
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: Admin-Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.partsunion.de
          VITE_SCRAPER_BASE_URL: https://api.partsunion.de

      - name: Unit tests and built-CSS probes
        run: npm run test:run -- --maxWorkers=2
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_SCRAPER_BASE_URL: http://localhost:3001

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
